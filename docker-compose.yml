services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vokasin
      POSTGRES_USER: vokasin
      POSTGRES_PASSWORD: vokasin
    ports:
      - "5433:5432"
    volumes:
      - vokasin-db:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  vokasin-db:

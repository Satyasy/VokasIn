services:
  db:
    # pgvector/pgvector:pg16 — Postgres 16 + ekstensi vector untuk embedding
    # pencarian semantik (lihat schema.sql "CREATE EXTENSION vector").
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vokasin
      POSTGRES_USER: vokasin
      POSTGRES_PASSWORD: vokasin
    ports:
      - "5433:5432"
    volumes:
      - vokasin-db:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  vokasin-db:
